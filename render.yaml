services:
  - type: web
    name: drop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: connectionString
      - key: XAI_API_KEY
        sync: false
      - key: XAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROK_MODEL
        value: openai/gpt-oss-120b
      - key: AI_MOCK_FALLBACK
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: drop-db
    plan: free
